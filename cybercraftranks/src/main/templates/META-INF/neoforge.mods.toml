modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/cybercraft/CyberCraft-Mods/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "CyberCraft Team"
description = '''
CyberCraft server ranklarini o'yin ichida ko'rsatadi.

Server tomoni ranklarni backenddan oladi va TAB ro'yxatidagi prefikslarni
scoreboard team'lari orqali qo'yadi -- buning uchun klientda mod shart emas.
Klient tomoni vanilla chiza olmaydigan narsalar uchun: nishonlar, maxsus
nameplate, ranklar oynasi va HUD. Klient backend bilan hech qachon
bog'lanmaydi, ma'lumot faqat serverdan keladi.
'''

# Optional payload: a client without this mod still connects and simply sees
# the vanilla team prefixes, so the mod is not required on the client side.
[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
