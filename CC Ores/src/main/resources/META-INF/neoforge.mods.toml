# This is an example neoforge.mods.toml file. It contains the data NeoForge uses to load your mod.
# It also contains data used by other mods and tools like Modrinth, CurseForge, and Discord.

modLoader="javafml" #mandatory

# A version range to match for said mod loader - for regular NeoForge versions it can be omitted
loaderVersion="[4,)" #mandatory This means any version from 4 to the next major version (5.0.0))

# The license for you mod. This is mandatory metadata and allows for easier comprehension of your redistributive properties.
# Review your options at https://choosealicense.com/. All rights reserved is the default copyright stance, and is thus the default.
license="All rights reserved"

# A URL to refer people to when problems occur with this mod
#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/" #optional

# A list of mods - how many allowed here is determined by the individual mod loader
[[mods]] #mandatory

# The modid of the mod
modId="ccores" #mandatory

# The version number of the mod
version="1.0.0" #mandatory

 # A display name for the mod
displayName="CC Ores" #mandatory

# A URL to query for updates for this mod. See the JSON update specification https://docs.neoforged.net/docs/misc/updatechecker
#updateJSONURL="https://change.me.to.your.update.json.example.invalid/" #optional

# A URL for the "homepage" for this mod, displayed in the mod UI
#displayURL="https://change.me.example.invalid/" #optional

# A file name (in the root of the mod JAR) containing a logo for display
logoFile="icon.png" #optional

# A text field displayed in the mod UI
credits="Thanks to the NeoForge team for their work" #optional

# A text field displayed in the mod UI
authors="YourName" #optional

# The description text for the mod (multi line!) (#mandatory)
description='''
CC Ores is a comprehensive ore generation and processing mod for Minecraft 1.21.1.
It provides a unified system for various metals, gems, and materials with full compatibility
across different mod ecosystems including Mekanism, IC2, and Tinkers' Construct.
'''

# A dependency - use the . to indicate dependency for a specific modid. This depends on neoForge and minecraft
[[dependencies.ccores]] #optional
    # the modid of the dependency
    modId="neoforge" #mandatory
    # Does this dependency have to exist - if not, ordering below must be specified
    mandatory=true #mandatory
    # The version range of the dependency
    versionRange="[21.0.0,)" #mandatory
    # An ordering relationship for the dependency - BEFORE or AFTER required if the relationship is not mandatory
    ordering="NONE"
    # Side this dependency is applied on - BOTH, CLIENT or SERVER
    side="BOTH" #mandatory

# Here's another dependency
[[dependencies.ccores]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.21.1,)"
    ordering="NONE"
    side="BOTH"