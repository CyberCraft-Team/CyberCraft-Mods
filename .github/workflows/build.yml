name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      # One mod failing must not hide the state of the other mod.
      fail-fast: false
      matrix:
        mod: ["CC Ores", "cybercraftranks"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Build ${{ matrix.mod }}
        working-directory: ${{ matrix.mod }}
        run: |
          chmod +x ./gradlew
          ./gradlew build
