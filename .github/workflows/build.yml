name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      # One mod failing must not hide the state of the other mod.
      fail-fast: false
      matrix:
        mod: ["CC Ores", "cybercraftranks"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Build ${{ matrix.mod }}
        working-directory: ${{ matrix.mod }}
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Checksum ${{ matrix.mod }} JARs
        working-directory: ${{ matrix.mod }}
        shell: bash
        run: |
          cd build/libs
          shopt -s nullglob
          jars=(*.jar)
          if (( ${#jars[@]} == 0 )); then
            echo "No built JARs found" >&2
            exit 1
          fi
          sha256sum -- "${jars[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Retain ${{ matrix.mod }} build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mods-${{ matrix.mod }}-${{ github.sha }}
          path: |
            ${{ matrix.mod }}/build/libs/*.jar
            ${{ matrix.mod }}/build/libs/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
